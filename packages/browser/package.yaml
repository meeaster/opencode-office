name: browser
description: Browser automation for agents. agent-browser drives a headless Chromium of its own, in either mode; in a host-mode office, Browse also drives the user's own Chrome, with their logins. Each is an MCP server in every session where it applies.
settings:
  agent_browser_tools:
    description: The tool profiles the agent-browser MCP server starts with (`agent-browser mcp --tools`), comma-separated, such as core, core,network or all; empty for no agent-browser server
    default: core
  browse:
    description: Whether a host-mode office gets Browse, the user's own Chrome, installed and as the browse MCP server; container-mode offices never do
    default: true
tools:
  "npm:agent-browser": "0.43.0"
# Browse auto-updates itself, as its Chrome extension does, and they negotiate a protocol, so it is
# installed once and never pinned: a pinned relay would drift from the extension.
host:
  setting: browse
  tools:
    # Runs the install script.
    bun: "1.4.4"
  install:
    description: Browse
    creates: ~/.local/bin/browse
    script: scripts/install-browse.ts
