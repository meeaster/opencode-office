name: office
description: What every office needs from OpenCode, given by its plugin; the guidance for a session's folder, the office skill and the office-executor MCP server; and the tools the office CLI itself runs.
cron:
  update-references:
    schedule: '0 6 * * *'
    script: scripts/update-references.sh
  upgrade-tools:
    schedule: '30 6 * * *'
    script: scripts/upgrade-tools.sh
  update-agent-clis:
    schedule: '30 7 * * *'
    script: scripts/update-agent-clis.sh
    when: managed-host
# The tools the office CLI itself runs, which every office gets in .office/mise/office.toml like any
# package's: SOPS and age for the office's encrypted secrets, gh for GitHub logins and sources, and
# pre-commit for the gitleaks hook in .pre-commit-config.yaml. The CLI runs the versions that file
# pins, as mise installed them, in any folder and from cron alike.
tools:
  sops: "3.13.3"
  age: "1.3.2"
  gh: "2.104.0"
  pre-commit: "4.7.0"
