name: aws-emulator
namespace: floci
description: A local AWS emulator, Floci (https://github.com/floci-io/floci), with its web console, in the office's compose project, for testing against AWS APIs without a real account; agents use it through the AWS CLI the package installs and the floci skill.
settings:
  port:
    description: The loopback port the AWS endpoint is published on, and Floci listens on inside its container, so http://localhost.floci.io:<port> answers on the host and the compose network alike
    default: 4566
  ui_port:
    description: The loopback port Floci's web console is published on, which the browser opens as http://floci.localhost:<ui_port>
    default: 4500
  storage:
    description: Floci's storage mode, memory, persistent, hybrid or wal; anything but memory keeps state across restarts in the floci-data volume
    default: memory
tools:
  aws-cli: "2.40.4"
# Floci labels every container, network and volume it starts with its resource namespace, which
# compose.yaml sets to the same value; office down removes those containers and networks.
spawns:
  label: floci_namespace=office-${OFFICE_NAME}-floci
