# Tools the office repository itself needs, in the office's folders only: every desk gets them, and a
# desk's own mise.toml adds more. The container installs them at start (in host mode, `office up`
# does). A tool wanted in every folder on the machine goes in machine.toml beside this file instead,
# which applies everywhere through a link in mise's global conf.d; inside the office this file wins.
# The tools the office CLI itself runs (SOPS, age, gh and pre-commit, for the gitleaks hook) come
# from the office package, in machine.packages.toml: pinning one here too only overrides it.
[tools]
node = "26.13.1"

# In a mise-activated shell, add AGENTS.md to native Claude Code's instruction files.
[env]
_.path = ["{{ config_root }}/.office/claude/bin"]
