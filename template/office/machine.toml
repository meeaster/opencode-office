# This office's machine-wide mise config: tools, at exact versions, and mise settings it wants in
# every folder of the machine rather than only in the office. It is the office's own file, edited
# freely; office sync never rewrites it, and office upgrade-tools bumps its exact versions.
#
# machine.packages.toml beside it holds the tools the office's packages need, which office sync
# keeps; this file wins over it, so pin a tool here to hold it back below a package's version
# (office check warns when one is below what a package was tested with). mise loads neither file
# where it is. In a host-mode office, office sync links both into mise's global conf.d (once office
# setup has your yes), this one last; the container links them inside itself. mise.toml beside it
# is folder-scoped instead: what the office repository itself needs, in the office's folders only,
# where it wins over this file, as a working repository's mise.toml does in its own.
[tools]
