# The office's declarations: only what OpenCode can't do itself. MCP servers, agents and
# published plugins go in .opencode/opencode.jsonc. Run `office sync` after changing this file.
name: __OFFICE__

# Optional: where this office's runtime state (passwords, tokens, the container's home) lives on
# this machine. The default is ~/.local/share/office/<name>.
# state: ~/.local/share/office/__OFFICE__

# Where OpenCode runs: `container` (the default), the office's opencode container, or `host`, an
# OpenCode server on this machine. The office attaches unless `managed: true` opts in to its
# systemd user service (Linux, with consent from office setup). The required office package
# schedules native Claude Code and OpenCode updates only in managed host mode.
# Executor and the office's other services always run in containers.
opencode: container
# Install official Executor catalog apps on setup or `office apps deploy`.
# executor:
#   catalog_apps: [github]
# opencode:
#   mode: host
#   url: http://127.0.0.1:49374
#   managed: true
#   listen_host: 0.0.0.0  # optional LAN access; keep url on IPv4 loopback for local clients
#   env_commands:
#     GITHUB_MCP_TOKEN: gh auth token
# secrets:
#   server: secrets/server.enc.yaml  # optional flat SOPS-encrypted mapping for managed OpenCode

# Optional: who the office commits as, the git default in the container and for its cron jobs (a
# repository's own config overrides it), and `credentials: gh` to authenticate HTTPS remotes with
# the host's gh login, which the container shares read-only. `credentials: gh` also authorizes
# `office setup` to run `gh auth setup-git`. Interactive setup offers both.
# git:
#   name: Your Name
#   email: you@example.com
#   credentials: gh

# The tools this office runs and how old a release must be before anything takes it.
# minimum_release_age covers package managers (npm, pnpm, uv and pip, through the office's
# environment), mise and the tools in its files, and each runtime below without an age of its own.
# The runtimes are the versions the containers run; in host mode only Executor's applies, and sfw's,
# which office up installs on the machine. office.lock (its runtime pins written by `office pin`;
# don't edit it) holds their checksums: run `office pin` after changing a version by hand. The daily upgrade-tools
# job bumps them; `office up --upgrade` applies a bump, `office up` never does. Give a runtime its
# own age with the mapping form, as executor has: it publishes a beta almost daily, and each upgrade
# means a backup, a restart and redeploying every app. sfw is Socket Firewall, which checks every
# package download against Socket's list of malicious packages: npm, npx, pnpm, pip, pip3, uv, uvx
# and cargo run through wrappers first on PATH, and mise's installs go through it too, in the
# container and, in host mode, on the machine (through ~/.local/share/office/env.sh, which you
# source from your shell). To turn it off, write sfw as { version: ..., enabled: false }; the
# release age still applies.
tools:
  minimum_release_age: 3d
  opencode: __OPENCODE_VERSION__
  claude: __CLAUDE_VERSION__
  codex: __CODEX_VERSION__
  executor: { version: __EXECUTOR_VERSION__, minimum_release_age: 7d }
  mise: __MISE_VERSION__
  sfw: __SFW_VERSION__

# Owner-declared read-only clones under references/. `office references list` also shows
# contributions from selected packages. Run `office sync` after changing either source.
references: []
#  - name: opencode
#    url: https://github.com/anomalyco/opencode.git
#    ref: dev
#    description: OpenCode's source and docs

desks:
  example:
    description: An example desk. Rename it, or add desks beside it.
    repos: []
    # Set to false for a desk without its own Executor app (reports, notifications, agent.ask).
    app: true

# OpenCode plugins developed in another repository, cloned into .opencode/plugins/<name>/.
plugins: []

# Optional capabilities. A package's OpenCode plugin, which it registers, loads in every session
# and gives it the package's skills, tools and MCP servers, and each file it declares as a seed is
# laid down once in the office (a file you delete stays deleted). A package is one of three kinds:
# - official, listed by name alone: shipped inside the office executable (knowledge, browser,
#   artifact-share, design, aws-emulator, skills), installed in .office/packages/<name>/ and
#   updated along with office. The core packages (office, opencode, references, seeds, cron and the
#   rest) are always installed: a core package need not be listed; list it once to configure it,
#   as cron below.
# - with repo, path and ref (a tag or a full commit SHA): copied from that repository into
#   .office/packages/<name>/, and updated when ref changes. With track (a branch, or a tag
#   pattern such as v1.*), office packages update moves ref to the newest match's commit.
# - written in this office, listed by name alone: packages/<name>/.
# .office/packages/ is read-only: office sync restores edited files there. To change such a
# package, copy it into packages/ under a name of your own. Settings aren't secrets: sync writes
# them to the package's .settings.json, which is committed. Packages' mise tools go in
# machine.packages.toml, whose versions are this office's to change (sync only raises one below
# what a package needs). Commit what sync writes.
# Removing an entry and syncing uninstalls an official or copied package; the files it seeded stay.
packages:
  # Lists the articles in knowledge/ in every session.
  - name: knowledge
  # Browser automation: agent-browser (headless Chromium, a mise tool) in either mode, and in host
  # mode Browse (the user's own Chrome, installed once, self-updating), each an MCP server.
  - name: browser
#  - name: artifact-share
#    settings:
#      url: https://<owner>.github.io/<repository>
# Standalone skills, linked into .agents/skills/<id> for every desk. Nothing is enabled until
# listed; office skills list shows what the sources offer. A folder source offers each skill
# folder in it; a Git source offers named folders at the full commit ref, which office skills
# update moves along track (a branch, or the highest stable tag matching a pattern such as v2.*).
#  - name: skills
#    settings:
#      sources:
#        - folder: skills
#        - repo: https://github.com/...
#          ref: <full commit SHA>
#          track: main
#          skills: [{ name: review, path: skills/review }]
#      enabled: [review]
# Scheduled jobs, in UTC: the office's own (scripts in this folder, run from it), and changes to
# packages' jobs by the ids `office cron list` prints. `office up` applies a schedule change.
#  - name: cron
#    settings:
#      jobs:
#        daily-report: { schedule: '0 6 * * *', script: cron/daily-report.sh }
#      overrides:
#        package.office.upgrade-tools: { enabled: false }
